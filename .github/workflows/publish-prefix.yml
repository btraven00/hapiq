name: Publish to prefix.dev

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for trusted publishing
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-64
            goos: linux
            goarch: amd64
          - target: osx-arm64
            goos: darwin
            goarch: arm64
          - target: osx-64
            goos: darwin
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      # A vX.Y.Z tag publishes release X.Y.Z and stamps it into the binary.
      # Pushes to main publish 0.0.0.dev<sha>, which sorts below any release,
      # and leave the binary unstamped so it reports "devel (sha, time)".
      - name: Compute version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "stamp=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0.dev$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "stamp=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w -X github.com/btraven00/hapiq/internal/version.Version=${{ steps.version.outputs.stamp }}" -o hapiq-bin .

      - name: Install rattler-build
        uses: prefix-dev/rattler-build-action@v0.2.37
        with:
          setup-only: true

      - name: Build conda package
        run: |
          printf 'version: ["%s"]\n' "${{ steps.version.outputs.version }}" > /tmp/variant.yaml
          SKIP_TEST=""
          if [ "${{ matrix.target }}" != "linux-64" ]; then
            SKIP_TEST="--no-test"
          fi
          rattler-build build \
            --recipe recipe/ \
            --target-platform ${{ matrix.target }} \
            -c conda-forge \
            --variant-config /tmp/variant.yaml \
            $SKIP_TEST

      - name: Upload to prefix.dev
        run: |
          rattler-build upload prefix \
            --channel almost-conductor \
            output/**/*.conda
